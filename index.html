<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ed">
<title>chill. — тихая пауза</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;--surface:#141414;--surface-2:#1a1a1a;
  --text:#e5e5e5;--muted:#737373;--dim:#444;
  --accent:#f97316;--accent-dim:rgba(249,115,22,.12);
  --accent-glow:rgba(249,115,22,.25);
  --border:rgba(249,115,22,.15);--border-2:rgba(249,115,22,.35);
  --radius:22px;--t:all .45s cubic-bezier(.25,.46,.45,.94);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:0 0 calc(72px + var(--safe-b));
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px;width:100%}
.panel{width:100%;max-width:680px;display:none;animation:panelIn .4s ease both}
.panel.active{display:block}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{
  background:var(--surface);border-radius:var(--radius);
  padding:56px 48px;border:1px solid var(--border);
  position:relative;overflow:hidden;min-height:280px;
  display:flex;flex-direction:column;justify-content:center;transition:var(--t);
}
.card::before{
  content:'';position:absolute;top:0;left:0;width:4px;height:100%;
  background:linear-gradient(to bottom,var(--accent),transparent 85%);
  border-radius:var(--radius) 0 0 var(--radius);
}
.card::after{
  content:'';position:absolute;bottom:0;right:0;width:120px;height:120px;
  background:radial-gradient(circle at bottom right,var(--accent-dim),transparent 70%);
  pointer-events:none;
}
.card:hover{border-color:var(--border-2);box-shadow:0 8px 40px rgba(249,115,22,.06)}
.badge{
  position:absolute;top:24px;right:28px;font-size:.6rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.14em;color:var(--accent);opacity:.8;padding:5px 11px;border-radius:100px;
  border:1px solid var(--border-2);background:var(--accent-dim);transition:var(--t);
}
.content{transition:var(--t)}
.content.exit{opacity:0;transform:translateY(-12px) scale(.98);filter:blur(4px)}
.content.enter{opacity:0;transform:translateY(12px) scale(.98);filter:blur(4px)}
.text{
  font-size:clamp(1.2rem,3.4vw,1.65rem);font-weight:400;line-height:1.55;
  color:#fff;letter-spacing:-.01em;margin-bottom:24px;white-space:pre-line;
}
.text::before{content:'“';color:var(--accent);font-size:1.3em;line-height:0;vertical-align:-.15em;margin-right:4px;opacity:.8}
.author{font-size:.92rem;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:10px;letter-spacing:.02em}
.author::before{content:'';width:22px;height:1px;background:var(--accent);opacity:.8;flex-shrink:0}
.author:empty{display:none}
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;justify-content:center;gap:0;
  padding:0 12px calc(8px + var(--safe-b));
  background:linear-gradient(to top,var(--bg) 70%,transparent);pointer-events:none;
}
.tabbar-inner{
  display:flex;gap:2px;pointer-events:auto;overflow-x:auto;overflow-y:visible;
  scrollbar-width:none;padding:8px 4px 0;max-width:100%;-webkit-overflow-scrolling:touch;
}
.tabbar-inner::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;display:flex;align-items:center;gap:6px;padding:9px 16px;
  border-radius:12px 12px 0 0;background:var(--surface);border:1px solid var(--border);
  border-bottom:none;color:var(--muted);font-size:.72rem;font-weight:500;
  cursor:pointer;transition:var(--t);white-space:nowrap;position:relative;top:1px;
  user-select:none;font-family:inherit;
}
.tab:hover{border-color:var(--border-2);color:var(--text);background:var(--surface-2)}
.tab.active{background:var(--surface);border-color:var(--accent);color:var(--accent);top:0;box-shadow:0 -4px 20px rgba(249,115,22,.08)}
.tab .icon{font-size:.9rem;line-height:1}
.actions{display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{
  width:48px;height:48px;border-radius:50%;background:var(--surface);
  border:1px solid var(--border-2);color:var(--accent);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:var(--t);font-family:inherit;
}
.btn:hover{background:var(--accent);color:var(--bg);transform:scale(1.08);box-shadow:0 0 24px var(--accent-glow)}
.btn:active{transform:scale(.94)}
.btn.text-btn{width:auto;height:auto;border-radius:100px;padding:10px 22px;font-size:.78rem;font-weight:500;gap:8px}
.breath-wrap{display:flex;flex-direction:column;align-items:center;gap:28px}
.breath-ring{
  width:180px;height:180px;border-radius:50%;border:3px solid var(--border-2);
  background:radial-gradient(circle,var(--accent-dim),transparent 70%);
  display:flex;align-items:center;justify-content:center;
  transition:transform 4s ease-in-out, box-shadow 4s ease-in-out;position:relative;
}
.breath-ring::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:1px solid var(--accent);opacity:.15}
.breath-ring.inhale{transform:scale(1.35);box-shadow:0 0 60px var(--accent-glow)}
.breath-ring.exhale{transform:scale(.75);box-shadow:0 0 20px transparent}
.breath-label{font-size:1.2rem;font-weight:500;color:var(--accent);letter-spacing:.06em}
.breath-hint{font-size:.78rem;color:var(--dim)}
.color-swatch{width:100%;height:180px;border-radius:16px;margin-bottom:20px;border:1px solid var(--border);transition:var(--t)}
.color-name{font-size:1.4rem;font-weight:600;color:#fff;margin-bottom:4px}
.color-hex{font-size:.85rem;color:var(--muted);font-family:monospace;letter-spacing:.05em}
.color-desc{font-size:.88rem;color:var(--muted);margin-top:12px;line-height:1.5}
.photo-wrap{
  width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--border);
  background:var(--surface-2);aspect-ratio:4/3;position:relative;
}
.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:var(--t)}
.photo-cap{font-size:.75rem;color:var(--muted);margin-top:12px;text-align:center;letter-spacing:.02em}
.sound-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.sound-chip{
  padding:14px 8px;border-radius:14px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--muted);font-size:.72rem;font-weight:500;
  cursor:pointer;transition:var(--t);text-align:center;font-family:inherit;
}
.sound-chip:hover{border-color:var(--border-2);color:var(--text)}
.sound-chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.word-big{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:600;color:#fff;margin-bottom:8px;letter-spacing:-.02em}
.word-pron{font-size:.9rem;color:var(--accent);margin-bottom:16px;font-family:monospace}
.word-pos{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.word-def{font-size:1rem;color:var(--text);line-height:1.55}
.step-icon{font-size:2.4rem;margin-bottom:16px}
.step-text{font-size:1.1rem;line-height:1.5;color:#fff;margin-bottom:20px}
.step-done{
  display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:100px;
  background:var(--accent);color:var(--bg);font-weight:600;font-size:.82rem;
  cursor:pointer;border:none;font-family:inherit;transition:var(--t);
}
.step-done:hover{box-shadow:0 0 24px var(--accent-glow);transform:scale(1.04)}
.step-done:active{transform:scale(.96)}
.timer{text-align:center;margin-top:20px;font-size:.75rem;color:var(--dim);letter-spacing:.05em}
.timer::after{content:'';display:block;width:36px;height:2px;background:var(--border-2);margin:10px auto 0;border-radius:2px}
@media(max-width:680px){
  .stage{padding:24px 14px}
  .card{padding:40px 24px;min-height:240px}
  .badge{top:16px;right:18px;font-size:.55rem}
  .tab{padding:8px 12px;font-size:.68rem}
  .tab .label{display:none}
  .tab .icon{font-size:1rem}
  .breath-ring{width:150px;height:150px}
  .sound-grid{grid-template-columns:repeat(2,1fr)}
  .text{font-size:1.1rem}
}
@media(max-width:380px){.tab{padding:7px 10px}.card{padding:32px 18px}}

/* CHILL QUIET EDITION */
:root{--bg:#f4f1ed;--surface:rgba(255,255,255,.82);--surface-2:#eeeaeb;--text:#393840;--muted:#777680;--dim:#96929a;--accent:#8580a8;--accent-dim:rgba(133,128,168,.10);--accent-glow:rgba(133,128,168,.16);--border:rgba(87,82,103,.12);--border-2:rgba(133,128,168,.32);--radius:22px;--t:all .28s cubic-bezier(.2,.65,.3,1)}
html{background:var(--bg);scroll-behavior:smooth}body{background:radial-gradient(ellipse at 12% 0%,rgba(218,210,226,.38),transparent 38%),radial-gradient(ellipse at 95% 100%,rgba(211,222,225,.34),transparent 35%),var(--bg);color:var(--text);padding:0 0 calc(20px + var(--safe-b))}
.stage{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-content:start;align-items:stretch;gap:18px;max-width:1240px;margin:0 auto;padding:34px 28px 44px}
.panel{display:block;width:100%;max-width:none;min-width:0;animation:panelIn .28s ease both}.panel.active{display:block}#p1,#p4,#p5{display:none!important}
.card{height:100%;min-height:0;padding:30px;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:0 14px 45px rgba(67,60,70,.045);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);justify-content:center}
.card:before{width:2px;background:linear-gradient(to bottom,rgba(133,128,168,.55),transparent 90%)}.card:after{width:100px;height:100px;background:radial-gradient(circle at bottom right,rgba(133,128,168,.07),transparent 72%)}.card:hover{border-color:var(--border-2);box-shadow:0 18px 48px rgba(67,60,70,.06)}
.text,.word-big,.step-text,.color-name{color:var(--text)}.text{font-size:clamp(1.08rem,1.55vw,1.4rem);line-height:1.6}.text:before,.author:before{color:var(--accent);background:var(--accent)}.badge{color:#77718f;background:rgba(133,128,168,.08);border-color:rgba(133,128,168,.18)}
.btn,.step-done{background:#8580a8;color:#fff;border-color:#8580a8;box-shadow:none}.btn:hover,.step-done:hover{background:#716b91;color:#fff;box-shadow:0 5px 18px rgba(133,128,168,.2)}.btn.text-btn{padding:10px 16px}.sound-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.sound-chip{background:#f8f6f8;border-color:var(--border);color:#686671;padding:12px 8px;border-radius:13px}.sound-chip:hover{background:#fff;border-color:var(--border-2);color:var(--text)}.sound-chip.on{background:var(--accent-dim);border-color:var(--accent);color:#716b91}
.breath-ring{border-color:rgba(133,128,168,.4);background:radial-gradient(circle,rgba(133,128,168,.12),transparent 72%)}.breath-ring:after{border-color:rgba(133,128,168,.4)}.breath-label,.word-pron{color:#77718f}.breath-hint,.timer,.color-desc{color:var(--muted)}.step-done{background:var(--accent);color:#fff}.tabbar{display:none}.audio-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}.audio-footer strong{display:block;font-size:.9rem;font-weight:600;color:var(--text);margin-bottom:4px}.audio-footer span{display:block;font-size:.76rem;color:var(--muted)}.sound-controls{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}.volume-control{display:flex;align-items:center;gap:10px;font-size:.75rem;color:var(--muted)}.volume-control input{width:110px;accent-color:var(--accent)}
#p7{grid-column:1/-1;grid-row:1}#p3{grid-column:span 5;grid-row:2}#p0{grid-column:span 7;grid-row:2}#p2{grid-column:span 4;grid-row:3}#p6{grid-column:span 4;grid-row:3}#p10{grid-column:span 4;grid-row:3}#p8{grid-column:span 6;grid-row:4}#p9{grid-column:span 6;grid-row:4}
#p0 .card{min-height:250px}#p3 .card{min-height:300px}#p7 .card{padding:26px 30px}#p7 .text{margin-bottom:4px}
@media(max-width:760px){body{padding:0 0 calc(76px + var(--safe-b))}.stage{display:block;padding:22px 14px 30px}.panel{display:none!important;max-width:620px;margin:0 auto}.panel.active{display:block!important}.card{padding:38px 24px;min-height:230px}.tabbar{display:flex;padding-bottom:calc(8px + var(--safe-b));background:linear-gradient(to top,rgba(244,241,237,.98) 70%,transparent)}.tabbar-inner{gap:5px;padding-top:8px}.tab{background:rgba(255,255,255,.85);border-color:var(--border);color:var(--muted);border-radius:14px 14px 0 0;padding:10px 13px}.tab.active{background:#fff;border-color:var(--border-2);color:#716b91;box-shadow:0 -3px 16px rgba(87,82,103,.05)}.tab .label{display:inline}.tab .icon{font-size:.95rem}.sound-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.audio-footer{align-items:flex-start;flex-direction:column}.audio-footer .btn{align-self:flex-start}.breath-ring{width:150px;height:150px}.text{font-size:1.1rem}}
@media(max-width:390px){.tab{padding:9px 10px}.tab .label{font-size:.64rem}.card{padding:32px 19px}.sound-chip{font-size:.7rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="stage">

  <!-- 0. ЦИТАТНИК -->
  <div class="panel active" id="p0">
    <div class="card">
      <div class="badge" id="badge0">мысль</div>
      <div class="content" id="c0">
        <div class="text" id="t0"></div>
        <div class="author" id="a0"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="nextTab(0)" aria-label="Следующая">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
    <div class="timer" id="tmr0"></div>
  </div>

  <!-- 1. ВИЗУАЛЬНЫЙ ШУМ -->
  <div class="panel" id="p1">
    <div class="card">
      <div class="badge">шум</div>
      <div id="noise" style="width:100%;height:220px;border-radius:16px;transition:background 1.2s ease"></div>
      <div class="color-desc" style="text-align:center;margin-top:16px">Случайный градиент</div>
    </div>
    <div class="actions">
      <button class="btn" onclick="newNoise()" aria-label="Новый шум">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>

  <!-- 2. СЛОВО -->
  <div class="panel" id="p2">
    <div class="card">
      <div class="badge">слово</div>
      <div class="content" id="c2">
        <div class="word-big" id="w2"></div>
        <div class="word-pron" id="wp2"></div>
        <div class="word-pos" id="wpos2"></div>
        <div class="word-def" id="wd2"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="newWord()" aria-label="Следующее слово">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>

  <!-- 3. ДЫХАНИЕ -->
  <div class="panel" id="p3">
    <div class="card">
      <div class="badge">дыхание</div>
      <div class="breath-wrap">
        <div class="breath-ring" id="ring"></div>
        <div class="breath-label" id="blabel">Нажмите старт</div>
        <div class="breath-hint">4 секунды вдох · 4 задержка · 4 выдох</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn text-btn" id="breathBtn" onclick="toggleBreath()">▶ Старт</button>
    </div>
  </div>

  <!-- 4. ЦВЕТ ДНЯ -->
  <div class="panel" id="p4">
    <div class="card">
      <div class="badge">цвет дня</div>
      <div class="color-swatch" id="swatch"></div>
      <div class="color-name" id="cname"></div>
      <div class="color-hex" id="chex"></div>
      <div class="color-desc" id="cdesc"></div>
    </div>
  </div>

  <!-- 5. ОДИН КАДР -->
  <div class="panel" id="p5">
    <div class="card">
      <div class="badge">кадр</div>
      <div class="photo-wrap">
        <img id="photoImg" alt="Случайное фото" loading="lazy">
      </div>
      <div class="photo-cap" id="photoCap">Загрузка...</div>
    </div>
    <div class="actions">
      <button class="btn" onclick="newPhoto()" aria-label="Новое фото">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>

  <!-- 6. ШАГ ЗА ШАГОМ -->
  <div class="panel" id="p6">
    <div class="card">
      <div class="badge">шаг</div>
      <div class="content" id="c6">
        <div class="step-icon" id="si6"></div>
        <div class="step-text" id="st6"></div>
        <button class="step-done" id="sd6" onclick="markDone()">✓ Сделано</button>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="newStep()" aria-label="Следующий шаг">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>

  <!-- 7. ЗВУК -->
  <div class="panel" id="p7">
    <div class="card">
      <div class="badge">звук</div>
      <div class="text" style="font-size:1rem;margin-bottom:8px">Выберите атмосферу</div>
      <div class="sound-grid" id="soundGrid"></div>
      <div class="audio-footer"><div><strong>Lo-Fi Radio</strong><span id="musicStatus">Фоновая музыка для работы и отдыха</span></div><button class="btn text-btn" id="musicToggle" onclick="toggleMusic()">▶ Включить</button></div>
    </div>
    <div class="actions">
      <div class="sound-controls"><button class="btn text-btn" id="soundStop" onclick="stopSound()" style="display:none">■ Остановить звук</button><label class="volume-control">Громкость <input id="volumeControl" type="range" min="0" max="1" step="0.05" value="0.45" aria-label="Громкость"></label></div>
    </div>
  </div>

  <!-- 8. АСТРО-ФАКТ -->
  <div class="panel" id="p8">
    <div class="card">
      <div class="badge">космос</div>
      <div class="content" id="c8">
        <div class="text" id="t8" style="font-size:1.1rem"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="newAstro()" aria-label="Следующий факт">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>

  <!-- 9. СТИХ -->
  <div class="panel" id="p9">
    <div class="card">
      <div class="badge">стих</div>
      <div class="content" id="c9">
        <div class="text" id="t9" style="font-size:1.05rem;white-space:pre-line"></div>
        <div class="author" id="a9"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="newPoem()" aria-label="Следующий стих">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>

  <!-- 10. АФФИРМАЦИЯ -->
  <div class="panel" id="p10">
    <div class="card">
      <div class="badge">напоминание</div>
      <div class="content" id="c10">
        <div class="text" id="t10" style="font-size:1.35rem;text-align:center"></div>
      </div>
    </div>

function buildTabs(){
  document.getElementById('tabbar').innerHTML = TABS.map(t=>`
    <button class="tab ${t.id===currentTab?'active':''}" data-id="${t.id}" onclick="switchTab(${t.id})">
      <span class="icon">${t.icon}</span>
      <span class="label">${t.label}</span>
    </button>
  `).join('');
}

function switchTab(id){
  currentTab = id;
  localStorage.setItem('tab', id);
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('p'+id).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', parseInt(t.dataset.id)===id));
  initTab(id);
}

function initTab(id){
  switch(id){
    case 0: resetQuoteTimer(); break;
    case 3: stopBreath(); break;
    case 6: newStep(); break;
  }
}

let qi = 0;

function showQuote(i){
  const item = shuffled[i % shuffled.length];
  const c = document.getElementById('c0');
  c.classList.add('exit');
  setTimeout(()=>{
    document.getElementById('t0').textContent = item.t;
    document.getElementById('a0').textContent = item.a;
    document.getElementById('badge0').textContent = item.type;
    c.classList.remove('exit'); c.classList.add('enter');
    void c.offsetHeight;
    c.classList.remove('enter');
  },450);
}

function nextTab(which){
  if(which===0){
    qi = (qi+1)%shuffled.length;
    showQuote(qi);
    resetQuoteTimer();
  }
}

function resetQuoteTimer(){
  clearInterval(timers.quote);
  let left = 60;
  const el = document.getElementById('tmr0');
  const upd = ()=>{ el.textContent = `следующая через ${left} сек`; };
  upd();
  timers.quote = setInterval(()=>{
    left--; upd();
    if(left<=0){ qi=(qi+1)%shuffled.length; showQuote(qi); left=60; }
  },1000);
}

let breathTimer = null, breathPhase = 0;
const PHASES = [
  {cls:'inhale', label:'Вдох', dur:4000},
  {cls:'', label:'Задержка', dur:4000},
  {cls:'exhale', label:'Выдох', dur:4000},

];

function toggleBreath(){
  if(breathTimer){ stopBreath(); return; }
  document.getElementById('breathBtn').textContent = '■ Стоп';
  breathPhase = 0;
  runBreathPhase();
}

function runBreathPhase(){
  const p = PHASES[breathPhase];
  const ring = document.getElementById('ring');
  const label = document.getElementById('blabel');
  ring.className = 'breath-ring ' + p.cls;
  label.textContent = p.label;
  breathTimer = setTimeout(()=>{
    breathPhase = (breathPhase+1) % PHASES.length;
    runBreathPhase();
  }, p.dur);
}

function stopBreath(){
  clearTimeout(breathTimer);
  breathTimer = null;
  document.getElementById('ring').className = 'breath-ring';
  document.getElementById('blabel').textContent = 'Нажмите старт';
  document.getElementById('breathBtn').textContent = '▶ Старт';
}

async function newPhoto(){
  const img = document.getElementById('photoImg');
  const cap = document.getElementById('photoCap');
  cap.textContent = 'Загрузка...';
  try{
    const r = await fetch('https://picsum.photos/v2/list?page=' + Math.floor(Math.random()*20+1) + '&limit=1');
    const d = await r.json();
    const photo = d[0];
    if(!photo) throw new Error('нет фото');
    img.src = `https://picsum.photos/id/${photo.id}/800/600`;
    img.onload = () => { cap.textContent = photo.author; };
    img.onerror = () => { cap.textContent = 'Фото не загрузилось'; };
  }catch(e){
    img.src = '';
    cap.textContent = 'Не удалось загрузить. Проверьте интернет.';
  }
}

let currentSound = null;
function buildSounds(){
  document.getElementById('soundGrid').innerHTML = Object.entries(SOUNDS).map(([k,v])=>
    `<button class="sound-chip" data-key="${k}" onclick="playSound('${k}')">${v.label}</button>`
  ).join('');
}
buildSounds();

function playSound(key){
  const s = SOUNDS[key];
  if(!s) return;
  if(currentSound === key){ stopSound(); return; }
  audioEl.src = s.url;
  audioEl.volume = Number(document.getElementById('volumeControl')?.value || 0.45);
  audioEl.play().catch(()=>{ const status=document.getElementById('musicStatus'); if(status) status.textContent='Этот звук сейчас недоступен. Попробуйте другой.'; });
  currentSound = key;
  document.querySelectorAll('.sound-chip').forEach(c=>c.classList.toggle('on', c.dataset.key===key));
  document.getElementById('soundStop').style.display = 'flex';
}

function stopSound(){
  audioEl.pause();
  audioEl.src = '';
  currentSound = null;
  document.querySelectorAll('.sound-chip').forEach(c=>c.classList.remove('on'));
  document.getElementById('soundStop').style.display = 'none';
}

let lofiPlaying = false;
let lofiIdx = 0;
let lofiRetries = 0;

function toggleMusic(){
  if(lofiPlaying){ stopLofi(); }
  else { startLofi(); }
}

function startLofi(){
  lofiRetries = 0;
  lofiEl.volume = Number(document.getElementById('volumeControl')?.value || 0.45);
  lofiEl.src = LOFI_STREAMS[lofiIdx];
  lofiEl.play().then(()=>{
    lofiPlaying = true;
    document.getElementById('musicToggle').textContent = '■ Остановить';
    document.getElementById('musicStatus').textContent = 'Играет...';
  }).catch(()=>{
    tryNextLofi();
  });
}

function tryNextLofi(){
  if(lofiRetries >= 3){ stopLofi(); document.getElementById('musicStatus').textContent = 'Потоки недоступны'; return; }
  lofiRetries++;
  lofiIdx = (lofiIdx + 1) % LOFI_STREAMS.length;
  lofiEl.src = LOFI_STREAMS[lofiIdx];
  lofiEl.play().catch(()=>setTimeout(tryNextLofi, 2000));
}

function stopLofi(){
  lofiEl.pause();
  lofiEl.src = '';
  lofiPlaying = false;
  document.getElementById('musicToggle').textContent = '▶ Включить';
  document.getElementById('musicStatus').textContent = 'Фоновая музыка для работы и отдыха';
}

document.getElementById('volumeControl')?.addEventListener('input', e=>{ audioEl.volume=Number(e.target.value); lofiEl.volume=Number(e.target.value); });
lofiEl.addEventListener('error', tryNextLofi);
lofiEl.addEventListener('playing', ()=>{ lofiRetries = 0; });
